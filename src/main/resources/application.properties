# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/india_explorer_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# REPLACE 'your_password' with your actual MySQL root password
spring.datasource.password=Balabharath311#

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AWS Configuration
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretAccessKey=${AWS_SECRET_KEY}
aws.region=us-east-1

# ✅ Email Verification (OTP) Settings
# For Gmail: Use smtp.gmail.com. For others, update the host.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=balabharath.ai@gmail.com
# ⚠️ Use an "App Password" from Google, NOT your regular password
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Admin Security Key
app.admin.access-key=${MY_ADMIN_KEY}